[workspace]
authors = ["lorenzo <lorenzo.cerrone@uzh.ch>"]
channels = ["conda-forge"]
name = "ngio-table-compatibility"
platforms = ["osx-arm64", "linux-64", "win-64"]
version = "0.1.0"

# Base Python dependencies
[feature.py13.dependencies]
python = "==3.13"
notebook = "*"

# Ngio 0.4 Environment
[feature.ngio04.pypi-dependencies]
ngio = ">=0.4,<0.5"

[feature.ngio04.tasks]
ngio04_create = { cmd = "python -m ngio_tables04 --dir ./tables --mode create", env = { PYTHONPATH = "src" } }
ngio04_check = { cmd = "python -m ngio_tables04 --dir ./tables --mode check", env = { PYTHONPATH = "src" } }

# Ngio 0.5 Environment
[feature.ngio05.pypi-dependencies]
ngio = ">=0.5,<0.6"

[feature.ngio05.tasks]
ngio05_create = { cmd = "python -m ngio_tables05 --dir ./tables --mode create", env = { PYTHONPATH = "src" } }
ngio05_check = { cmd = "python -m ngio_tables05 --dir ./tables --mode check", env = { PYTHONPATH = "src" } }
update-readme = "python scripts/build_compatibility_table.py"

# Environment definitions
[environments]
default = ["py13"]
ngio04 = ["py13", "ngio04"]
ngio05 = ["py13", "ngio05"]

[tasks]
check-success-ratio = "python scripts/check_success_ratio.py"

create-tables = [
    { task = "ngio04_create", env = "ngio04" },
    { task = "ngio05_create", env = "ngio05" },
]

check-tables = [
    { task = "ngio04_check", env = "ngio04" },
    { task = "ngio05_check", env = "ngio05" },
]
